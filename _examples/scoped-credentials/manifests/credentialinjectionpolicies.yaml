apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: example-api
spec:
  targetRefs:
    - group: clrk.apoxy.dev
      kind: EgressL4Route
      name: example-api
  secretRef:
    name: example-api-credentials
  target: Header
  headerName: Authorization
---
apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: internal-registry
spec:
  targetRefs:
    - group: clrk.apoxy.dev
      kind: EgressL4Route
      name: internal-registry
  secretRef:
    name: internal-registry-credentials
  target: Header
  headerName: Authorization
